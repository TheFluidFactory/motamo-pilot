name: Fix hint submit

on:
  push:
    paths:
      - 'trigger-fix-hint-submit.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch submit handling
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('js/hint-keyboard-patch.js')
          text = path.read_text(encoding='utf-8')

          marker = "    const confirmOverlay = document.querySelector('#confirm-overlay');\n"
          replacement = marker + "    const submitQuestionButton = document.querySelector('#submit-question');\n"
          if 'const submitQuestionButton' not in text:
              if marker not in text:
                  raise SystemExit('Submit button insertion marker not found')
              text = text.replace(marker, replacement, 1)

          insertion_marker = "    const questionObserver = new MutationObserver(initialiseQuestion);\n"
          submit_fix = '''    if (submitQuestionButton) {
      submitQuestionButton.addEventListener('click', (event) => {
        if (!gameIsActive()) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        if (!state.question) initialiseQuestion();
        syncGameEntry();
        window.setTimeout(() => {
          state.syncing = true;
          dispatchToGame('ENTER');
          state.syncing = false;
        }, 0);
      }, true);
    }

'''
          if 'submitQuestionButton.addEventListener' not in text:
              if insertion_marker not in text:
                  raise SystemExit('Submit listener insertion marker not found')
              text = text.replace(insertion_marker, submit_fix + insertion_marker, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Check syntax
        run: node --check js/hint-keyboard-patch.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/hint-keyboard-patch.js
          git diff --cached --quiet || (git commit -m "Fix answer validation with prefilled hint" && git push)
