name: Run keyboard patch

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'Run MOTAMO keyboard patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and run patch
        shell: bash
        run: |
          sed -n "/python <<'PY'/,/^          PY$/p" .github/workflows/patch-keyboard.yml | sed '1d;$d;s/^          //' > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Improve keyboard size and answer confirmation" && git push)
