name: Patch keyboard UX

on:
  push:
    paths:
      - '.github/workflows/patch-keyboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update keyboard and confirmation UX
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css_marker = '''    .brand-logo-splash{width:min(100%,22rem);max-width:22rem;max-height:55dvh;margin-inline:auto}\n  </style>'''
          css_patch = '''    .brand-logo-splash{width:min(100%,22rem);max-width:22rem;max-height:55dvh;margin-inline:auto}

    /* Larger, easier-to-tap in-app keyboard. */
    button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .keyboard-panel{gap:.42rem!important;padding:.7rem .55rem calc(.72rem + env(safe-area-inset-bottom))!important}
    .keyboard-row{gap:.3rem!important}
    .keyboard-row:last-child{padding-inline:1rem}
    .key{height:clamp(3rem,7.2dvh,3.5rem)!important;border-radius:.68rem!important;font-size:clamp(.94rem,3.3vw,1.12rem)!important;box-shadow:0 4px 0 #0a1d3c,inset 0 1px 0 rgba(255,255,255,.16)!important;touch-action:manipulation;user-select:none;-webkit-user-select:none}
    .key.confirm{display:none!important}
    .key:active,.key.is-pressed{transform:translateY(2px) scale(.985)!important;filter:brightness(1.16);box-shadow:0 1px 0 #0a1d3c,inset 0 1px 0 rgba(255,255,255,.18)!important}
    .key.action{flex:1.25!important}
    .key .icon{width:1.3rem!important;height:1.3rem!important}
    .answer-submit{width:calc(100% - .2rem);min-height:2.85rem;margin:.02rem .1rem .04rem;border-radius:.78rem;font-size:.88rem;box-shadow:0 7px 0 var(--purple-800),0 11px 22px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.22)}
    .answer-submit:active{transform:translateY(2px);box-shadow:0 4px 0 var(--purple-800),0 7px 14px rgba(0,0,0,.2)}
    @media(max-width:390px){.keyboard-panel{gap:.36rem!important;padding:.58rem .38rem calc(.62rem + env(safe-area-inset-bottom))!important}.keyboard-row{gap:.22rem!important}.keyboard-row:last-child{padding-inline:.55rem}.key{height:clamp(2.85rem,7dvh,3.15rem)!important;border-radius:.6rem!important;font-size:clamp(.88rem,3.6vw,1rem)!important}.answer-submit{min-height:2.7rem;font-size:.82rem}}
    @media(max-width:340px){.keyboard-panel{gap:.31rem!important;padding-inline:.3rem!important}.keyboard-row{gap:.16rem!important}.keyboard-row:last-child{padding-inline:.3rem}.key{height:2.75rem!important;border-radius:.52rem!important;font-size:.86rem!important}.answer-submit{min-height:2.6rem;font-size:.78rem}}
    @media(max-height:650px){.keyboard-panel{gap:.28rem!important;padding-top:.42rem!important;padding-bottom:calc(.46rem + env(safe-area-inset-bottom))!important}.key{height:2.65rem!important}.question-card{min-height:4.8rem}.game-stack{gap:.48rem}.block-answer-card,.collection-panel{padding:.55rem}.answer-submit{min-height:2.5rem}}
  </style>'''

          if 'Larger, easier-to-tap in-app keyboard' not in html:
              if css_marker not in html:
                  raise SystemExit('CSS insertion marker not found')
              html = html.replace(css_marker, css_patch, 1)

          script_patch = '''
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const dispatchGameKey = (key) => {
        const browserKey = key === 'BACKSPACE' ? 'Backspace' : key;
        document.dispatchEvent(new KeyboardEvent('keydown', { key: browserKey, bubbles: true }));
      };

      const makeResponsiveKey = (button) => {
        const replacement = button.cloneNode(true);
        const key = replacement.dataset.key;
        let lastPointerHandled = 0;

        replacement.addEventListener('pointerdown', (event) => {
          if (event.pointerType === 'mouse' && event.button !== 0) return;
          event.preventDefault();
          lastPointerHandled = performance.now();
          replacement.classList.add('is-pressed');
          window.setTimeout(() => replacement.classList.remove('is-pressed'), 90);
          dispatchGameKey(key);
        });

        replacement.addEventListener('click', (event) => {
          if (performance.now() - lastPointerHandled < 500) {
            event.preventDefault();
            return;
          }
          dispatchGameKey(key);
        });

        button.replaceWith(replacement);
      };

      document.querySelectorAll('.keyboard-panel .key.confirm').forEach((button) => button.remove());
      document.querySelectorAll('.keyboard-panel .key').forEach(makeResponsiveKey);

      const createSubmitButton = (id, label, anchor) => {
        if (!anchor || document.querySelector(`#${id}`)) return;
        const button = document.createElement('button');
        button.id = id;
        button.type = 'button';
        button.className = 'button button-primary answer-submit';
        button.innerHTML = `<svg class="icon"><use href="#i-check"></use></svg>${label}`;
        button.addEventListener('click', () => dispatchGameKey('Enter'));
        anchor.insertAdjacentElement('afterend', button);
      };

      createSubmitButton('submit-question', 'Valider la réponse', document.querySelector('[data-screen="game"] .block-answer-card'));
      createSubmitButton('submit-final', 'Valider le mot', document.querySelector('[data-screen="final"] .block-answer-card'));
    });
  </script>
'''

          if 'makeResponsiveKey' not in html:
              if '</body>' not in html:
                  raise SystemExit('Body closing marker not found')
              html = html.replace('</body>', script_patch + '\n</body>', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit the live update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Improve keyboard size and answer confirmation"
            git push
          fi
