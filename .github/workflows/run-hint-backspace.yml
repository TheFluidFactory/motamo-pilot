name: Run hint and backspace patch

on:
  push:
    paths:
      - 'trigger-hint-backspace.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and run patch
        shell: bash
        run: |
          sed -n "/python <<'PY'/,/^          PY$/p" .github/workflows/patch-hint-backspace.yml | sed '1d;$d;s/^          //' > /tmp/patch.py
          python /tmp/patch.py
      - name: Check JavaScript syntax
        run: node --check js/app.js
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/app.js
          git diff --cached --quiet || (git commit -m "Move backspace and add answer hint letter" && git push)
